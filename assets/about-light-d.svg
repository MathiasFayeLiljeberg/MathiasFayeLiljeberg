<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="272" viewBox="0 0 1000 272" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEE6F8"/></linearGradient>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#D9CBEE"/></pattern>
<linearGradient id="fd" x1="0" x2="1"><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
<mask id="m"><rect width="1000" height="272" fill="url(#fd)"/></mask><style></style></defs>
<rect x=".5" y=".5" width="999" height="271" rx="16" fill="url(#bg)" stroke="#D5C6EC"/>
<rect x="64" y="51" width="28" height="4" rx="2" fill="#4A1F73"/><text x="104" y="58" font-size="15" font-weight="700" letter-spacing="2.2" fill="#59636E">OM MIG</text><text x="64" y="100" font-size="18" fill="#1F2328">Jeg er projektleder hos ShopHelten, et Shopify Premier-bureau, frem til 31. januar 2027. Her hjælper</text><text x="64" y="130" font-size="18" fill="#1F2328">jeg brands med at få mere ud af deres webshop – både forretningsmæssigt og teknisk. Jeg står midt</text><text x="64" y="160" font-size="18" fill="#1F2328">imellem kunden, udvikleren og eksterne partnere: jeg afklarer behovet, skitserer en løsning og følger</text><text x="64" y="190" font-size="18" fill="#1F2328">den hele vejen til noget, der virker i praksis. AI-agents og agent-workflows er en fast del af</text><text x="64" y="220" font-size="18" fill="#1F2328">værktøjskassen – til research, QA, analyse og dokumentation.</text></svg>